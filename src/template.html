<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DcodeD &mdash; Belief-Change Qualitative Coding Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* CSS_INJECTED_HERE */
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="topbar-left">
      <h1>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        DcodeD
      </h1>
      <span class="subtitle">Belief-Change Qualitative Coding Explorer</span>
    </div>
    
    <div class="topbar-stats" id="statsBar">
      <span>Loading dataset&hellip;</span>
    </div>

    <div class="topbar-actions">
      <button class="btn btn-outline" id="copyShareLinkBtn" title="Copy shareable reference link for current filters">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        Share View
      </button>
      <button class="btn btn-outline" id="exportBtn" title="Export currently filtered view as CSV">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export
      </button>
      <button class="filters-toggle" id="filtersToggleBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
        Filters
      </button>
    </div>
  </header>

  <div class="layout">
    <main class="feed-container" id="feedContainer">
      <div class="feed-header">
        <div class="active-filters-bar" id="activeFiltersBar" style="display:none;"></div>
      </div>
      <div id="feed"></div>
      <div class="pagination-bar" id="paginationBar" style="display:none;">
        <button class="btn btn-outline" id="loadMoreBtn">Load More Conversations</button>
      </div>
    </main>
    <div class="filters-scrim" id="filtersScrim"></div>
    <aside class="filters" id="filters"></aside>
  </div>
</div>

<div class="toast" id="toast">Link copied to clipboard!</div>

<script id="app-data" type="application/json">/* DATA_INJECTED_HERE */</script>

<script>
/* JS_INJECTED_HERE */
</script>
</body>
</html>
